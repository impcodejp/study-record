# =====================================================================
# 資格勉強回答正誤記録アプリ の nginx 設定（インターネット公開・HTTPS 版）
#
# ・証明書は Let's Encrypt（無料）を使う。取得・自動更新の手順は README.md を参照
# ・http:// へのアクセスは https:// へ転送する（証明書の取得・更新の確認用の URL だけは http のまま応答する）
# ・Windows の nginx では conf/nginx.conf の http { } 内で include する
#     include  C:/path/to/ProjectRoot/nginx/study-record-https.conf;
#   Ubuntu では /etc/nginx/conf.d/ に置き、パスを Linux 用に書き換える
# ・「study.example.com」と「C:/path/to/...」は、実際のドメイン名とパスに書き換える
# ・http2 の指定は nginx 1.25.1 以降の書き方。それより古い場合は
#   「http2 on;」を消し、「listen 443 ssl http2;」と書く
#
# app.ini は次のようにする：
#   public_url = https://study.example.com
#   cookie_secure = true
#   trust_proxy = true
# =====================================================================

# 注意：このファイルと study-record.conf（http 版）は、どちらか一方だけを include する
#       （両方を読み込むと limit_req_zone などが重複して nginx が起動しない）

# nginx のバージョンを応答に含めない
server_tokens off;

# ログイン・登録系 API の総当たり対策（接続元 IP ごとに 1 分 10 回まで。少しの連打は許す）
# アプリ側でもメールアドレス・IP ごとのロックを行っており、ここは手前の防波堤。
limit_req_zone $binary_remote_addr zone=study_auth:10m rate=10r/m;
# API 全体の過剰なアクセス対策（接続元 IP ごとに 1 秒 20 回まで）
limit_req_zone $binary_remote_addr zone=study_api:10m rate=20r/s;
limit_req_status 429;

upstream study_record_api {
    # API サーバーは 127.0.0.1 だけで待ち受け、外部からは nginx 経由でしか届かないようにする
    server 127.0.0.1:8080;
    keepalive 16;
}

# ---------------------------------------------------------------------
# http（80 番）：証明書の確認用 URL 以外は https へ転送する
# ---------------------------------------------------------------------
server {
    listen       80;
    server_name  study.example.com;

    # Let's Encrypt の確認用ファイル（win-acme / certbot の webroot と同じフォルダを指定する）
    location ^~ /.well-known/acme-challenge/ {
        root C:/path/to/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# https（443 番）：画面の配信と API の転送
# ---------------------------------------------------------------------
server {
    listen       443 ssl;
    http2        on;
    server_name  study.example.com;

    # 証明書（中間証明書を含むもの）と秘密鍵
    #   Windows（win-acme）: 出力フォルダに作られる *-chain.pem と *-key.pem
    #   Ubuntu（certbot）  : /etc/letsencrypt/live/<ドメイン>/fullchain.pem と privkey.pem
    ssl_certificate      C:/path/to/certs/study.example.com-chain.pem;
    ssl_certificate_key  C:/path/to/certs/study.example.com-key.pem;

    # 暗号の設定（Mozilla の推奨「Intermediate」相当。古い TLS 1.0 / 1.1 は使わない）
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache    shared:study_ssl:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    # フロントエンドのビルド結果（npm run build で作られる）
    root   C:/path/to/ProjectRoot/frontend/dist;
    index  index.html;

    # 回答・メモの送信サイズは小さいため上限を低めにする
    client_max_body_size 64k;

    # セキュリティ関連のヘッダー
    # HSTS：以後 1 年間はブラウザが必ず https で接続する（http に戻す予定が無いことを確認してから有効にする）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 転送時に共通で付けるヘッダー
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # 回数制限（429）の応答を、アプリと同じ { "error": "..." } 形式にする
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"アクセスが集中しています。しばらく待ってから再度お試しください。"}';
    }

    # ログイン・新規登録・パスワード再設定は回数を強めに制限する
    location ~ ^/api/auth/(login|register|resend-verification|forgot-password|reset-password|verify-email)$ {
        limit_req  zone=study_auth burst=5 nodelay;
        proxy_pass http://study_record_api;
    }

    # その他の API
    location /api/ {
        limit_req  zone=study_api burst=40 nodelay;
        proxy_pass http://study_record_api;
    }

    # ビルド済みの JS / CSS はファイル名にハッシュが付くため長くキャッシュする
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # location 内で add_header を使うと上のヘッダーが引き継がれないため、HSTS などを付け直す
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 画面の URL（/exams/1 など）はすべて index.html を返し、React 側で振り分ける
    location / {
        add_header Cache-Control "no-cache";
        # location 内で add_header を使うと上のヘッダーが引き継がれないため、付け直す
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    access_log  logs/study-record.access.log;
    error_log   logs/study-record.error.log warn;
}
