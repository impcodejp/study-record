# =====================================================================
# 資格勉強回答正誤記録アプリ の nginx 設定（見本）
#
# ・フロントエンド（frontend/dist）を配信し、/api を API サーバーへ転送する
# ・Windows の nginx では conf/nginx.conf の http { } 内で include する
#     include  C:/path/to/ProjectRoot/nginx/study-record.conf;
# ・Linux（Ubuntu）では /etc/nginx/conf.d/ に置く
# ・HTTPS 化する場合は listen 443 ssl と証明書を設定し、
#   app.ini の cookie_secure = true / public_url = https://... にする
# =====================================================================

upstream study_record_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen       80;
    server_name  localhost;

    # フロントエンドのビルド結果（npm run build で作られる）
    root   C:/path/to/ProjectRoot/frontend/dist;
    index  index.html;

    # 回答・メモの送信サイズは小さいため上限を低めにする
    client_max_body_size 64k;

    # セキュリティ関連のヘッダー
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

    # API は Rust の API サーバーへ転送する
    location /api/ {
        proxy_pass         http://study_record_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ビルド済みの JS / CSS はファイル名にハッシュが付くため長くキャッシュする
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 画面の URL（/exams/1 など）はすべて index.html を返し、React 側で振り分ける
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    access_log  logs/study-record.access.log;
    error_log   logs/study-record.error.log warn;
}
