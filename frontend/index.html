<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      seo:start 〜 seo:end は検索エンジン向けの情報。
      紹介ページ以外（ログイン後の画面など）は検索結果に出さないため noindex にする。
      紹介ページはビルド時に scripts/prerender.mjs がこの部分を差し替え、本文も HTML にする。
    -->
    <!-- seo:start -->
    <title>学習記録 - 資格試験の勉強記録・復習アプリ</title>
    <meta
      name="description"
      content="問題集の回答を記録して自己採点するだけ。忘れかけた問題と、試験日までに必要なペースがわかる資格試験の学習記録アプリです。"
    />
    <meta name="robots" content="noindex" />
    <!-- seo:end -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- ホーム画面に追加して使うための設定 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#2a78d6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="学習記録" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
