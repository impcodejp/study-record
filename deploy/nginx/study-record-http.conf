# =====================================================================
# 【nginx 用】資格勉強回答正誤記録アプリ の nginx 設定（http 版・社内利用向け）
#
# ・画面（html フォルダ）を配信し、/api を API サーバー（Windows サービス）へ転送する
# ・配置は deploy/nginx/install-nginx.ps1 が行う（手順は deploy/README.md）
#     このファイルは nginx の conf\study-record.conf としてコピーされ、
#     conf\nginx.conf の http { } 内に「include study-record.conf;」を 1 行足して読み込む
# ・「C:/nginx/」は install-nginx.ps1 が実際の nginx のフォルダに書き換える
# ・インターネットに公開する場合は study-record-https.conf（HTTPS 版）を使う
# =====================================================================

upstream study_record_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

# トップ（/）で返すページ：ログインの Cookie（sr_session）が無い人には、検索エンジン向けに
# 中身を書き出した紹介ページ（welcome/index.html）を、ある人にはアプリ（index.html）を返す
map $cookie_sr_session $study_record_home {
    ""      /welcome/index.html;
    default /index.html;
}

server {
    listen       80;
    server_name  localhost;

    # 画面（build-release.ps1 が作る release\nginx\html を install-nginx.ps1 がここへコピーする）
    root   C:/nginx/html/study-record;
    index  index.html;

    # 回答・メモの送信サイズは小さいため上限を低めにする
    client_max_body_size 64k;

    # 文字のファイルを圧縮して送り、表示を速くする（画像はもともと圧縮済みのため対象外）
    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;
    gzip_vary       on;

    # セキュリティ関連のヘッダー
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

    # Let's Encrypt の確認用ファイル（HTTPS 版へ切り替える前に、この http 版のまま証明書を取得するため）
    location ^~ /.well-known/acme-challenge/ {
        root C:/nginx/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # API は Rust の API サーバーへ転送する
    location /api/ {
        proxy_pass         http://study_record_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ビルド済みの JS / CSS はファイル名にハッシュが付くため長くキャッシュする
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ホーム画面に追加するための設定ファイル（古い nginx の mime.types には種類の登録が無いため指定する）
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # トップ：ログインしているかどうかで返すページを変える（上の map を参照）
    location = / {
        add_header Cache-Control "no-cache";
        # ログインの有無で中身が変わるため、途中のキャッシュが混ぜないようにする
        add_header Vary Cookie;
        try_files $study_record_home =404;
    }

    # 画面の URL（/exams/1 など）はすべて index.html を返し、React 側で振り分ける
    # （/welcome は書き出した紹介ページ、robots.txt・sitemap.xml・sw.js もここで返す。no-cache で新しい版がすぐ届く）
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    access_log  logs/study-record.access.log;
    error_log   logs/study-record.error.log warn;
}
